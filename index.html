<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RoyalsReign Alliance Dashboard</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tabler-icons/3.44.0/tabler-icons.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600&display=swap">
<style>
#app{
  --font-sans:'Inter', system-ui, sans-serif;
  --font-display:'Cinzel', Georgia, serif;
  --surface-0:#0b0810;
  --surface-1:#1c160f;
  --surface-2:#221a12;
  --text-primary:#f5eddb;
  --text-secondary:#c7b998;
  /* v64: was #8f8267. That measured 5.1:1 against the middle of the page
     gradient but 3.9:1 against its lighter top stop — under the 4.5:1 floor,
     and this is the colour of most of the explanatory copy in the dashboard.
     Two shades up clears it everywhere, including the top of the page. */
  --text-muted:#a3957a;
  --border:rgba(212,175,55,0.16);
  --border-strong:rgba(212,175,55,0.32);
  --border-accent:#d4af37;
  --text-accent:#f0cf72;
  --bg-accent:rgba(212,175,55,0.14);
  --text-danger:#ff9a82;
  --border-danger:#c0392b;
  --fill-danger:#c0392b;
  --text-success:#b9d98d;
  --text-warning:#f0c869;
  --radius:10px;
  /* ── v63: one colour, one meaning ────────────────────────────────────────
     A badge colour answers exactly one question: DOES AN OFFICER NEED TO DO
     SOMETHING? Nothing else may use these six.

       red    act now              Critical, Kickem List, over the cap
       coral  a problem, not urgent   Serious, Next To Go, repeat plunders
       amber  worth watching       Watch, Needs Attention, Far From Hive
       green  good, nothing to do
       blue   information, no judgement at all
       gray   nothing recorded

     Before this, three different colour languages shared one palette and
     collided. Amber meant "concern" on the roster and "Backup" in the duties
     grid. Green meant "fine" and also "Primary". Coral meant "Serious" and
     also "this member's name happened to hash there", because avatars picked
     a badge class at random. An officer scanning a screen could not tell
     whether a colour was telling them something, and a colour that sometimes
     means something teaches you to check every colour.

     Teal, purple and pink are gone from this palette entirely. They now exist
     only as avatar tints, which share no class name with badges so the two can
     never be confused again. */
  --badge-red-bg:rgba(192,57,43,0.2); --badge-red-fg:#ff9d86;
  --badge-amber-bg:rgba(191,138,42,0.22); --badge-amber-fg:#f0c869;
  --badge-coral-bg:rgba(198,102,56,0.22); --badge-coral-fg:#f0a479;
  --badge-blue-bg:rgba(55,97,158,0.22); --badge-blue-fg:#9dc0f0;
  --badge-green-bg:rgba(103,143,63,0.22); --badge-green-fg:#b9d98d;
  /* Rank, not attention. Duty levels are a hierarchy — Primary outranks
     Backup outranks Support — and none of the three is a problem. Expressed as
     three weights of one neutral rather than three hues, so the duties grid
     stops shouting amber at an officer for a rota that is perfectly fine. */
  --tier-1-bg:rgba(199,185,152,0.20); --tier-1-fg:#e6dcc4;
  --tier-2-bg:rgba(199,185,152,0.12); --tier-2-fg:#c7b998;
  --tier-3-bg:rgba(199,185,152,0.07); --tier-3-fg:#a99d80;
  /* Identity, not meaning. Eight tints for telling members apart in a list.
     Deliberately desaturated and deliberately NOT named like badges, because
     the previous set hashed names onto badge-coral and badge-red. */
  --av-1:#8fb4d9; --av-2:#c3a8dd; --av-3:#dba3b8; --av-4:#8fc9b4;
  --av-5:#d6b98a; --av-6:#a9c48c; --av-7:#c9a89a; --av-8:#9fb0c9;
  background:radial-gradient(ellipse 900px 500px at 50% -10%, #1c2740 0%, #100b18 45%, #0a070d 100%);
  border:0.5px solid var(--border);
  border-radius:20px;
  padding:1.75rem;
  font-family:var(--font-sans);
  color:var(--text-primary);
}
#app h2{ font-family:var(--font-display); color:var(--text-accent); letter-spacing:0.4px; }
#app h3{ font-family:var(--font-display); color:var(--text-primary); }
/* ── v62: buttons had no colours at all ────────────────────────────────────
   Until now the whole of the button styling was `border-radius:999px`. No
   background, no colour, no border. Every button therefore kept the browser's
   own default face, which on macOS Safari is a LIGHT grey pill — and then the
   components painted text onto it with inline styles like
   `color: var(--text-accent)`, which is pale gold.

   Pale gold on light grey measures 1.3:1. Readable text starts at 4.5:1. It
   was not slightly low, it was very nearly invisible, and it explains why some
   buttons read fine and others did not: the ones that set no inline colour
   kept the browser's dark default text and looked normal, so the fault never
   looked systematic.

   Giving buttons a real surface fixes every one of them at once, because the
   inline colours were always correct — they just had nothing to sit on.

   NOTE ON SPECIFICITY, because this is the trap here. `#app button` scores an
   id, which beats any bare class selector. The moment this rule declares a
   background, `.tab-pill{background:transparent}` and `.name-link{border:none}`
   stop winning and those controls turn into grey pills. Every button-like
   class below is therefore scoped to `#app` too. If a new button-like class is
   added later it must be scoped the same way or it will inherit this surface. */
#app button, #app select{ border-radius:999px; }
#app button{
  background:var(--surface-1);
  color:var(--text-primary);
  border:0.5px solid var(--border-strong);
  font-family:inherit;
  font-size:14px;
  line-height:1.4;
  padding:7px 14px;
  cursor:pointer;
}
#app button:disabled{ opacity:0.5; cursor:default; }
#app .icon-btn{ border-radius:var(--radius); }
/* v45. This rule styled the colours of form controls but never their type, so
   every input, dropdown and textarea rendered in the browser default (Arial,
   about 13px) while the rest of the dashboard is Inter. Most visible in the
   roster filter row, where the search box sat next to three dropdowns in a
   different typeface.
   The 16px floor below is not cosmetic: iOS Safari zooms the whole page when a
   field smaller than 16px receives focus, and then leaves it zoomed. That is
   most of what makes this dashboard unpleasant to use on a phone. */
#app input, #app select, #app textarea{
  background:var(--surface-1); border:0.5px solid var(--border); color:var(--text-primary); border-radius:var(--radius);
  font-family:inherit; font-size:15px; line-height:1.4;
}
@media (max-width:640px){
  /* ── v52: phones ──────────────────────────────────────────────────────────
     This is a mobile game. Officers triage from the same phone they play on,
     usually one-handed, and until now the dashboard was laid out for a laptop:
     sixteen tab pills wrapping into three rows, and 56px of a 390px screen
     spent on the border and padding of a card that fills the whole screen
     anyway.

     Everything here is CSS. The wide data grids are laid out with inline
     styles, which a stylesheet cannot override, so they are a separate job —
     this pass makes the app comfortable to hold and navigate, not to read a
     98-row table on. */

  /* !important because several controls set fontSize inline — the monospace
     import boxes, mostly — and an inline style beats a stylesheet. Scoped to
     phones, where the zoom behaviour makes this a usability fault rather than
     a preference. */
  #app input, #app select, #app textarea{ font-size:16px !important; }

  /* The card chrome costs about 56px of a 390px screen, framing something that
     already fills the display. On a phone the screen edge is the frame. */
  #app{
    padding:0.75rem;
    border-radius:0;
    border-left:none;
    border-right:none;
  }

  /* Sixteen pills wrapped to three rows and pushed the content off the fold.
     One row that scrolls sideways keeps them all reachable and keeps the top of
     the page where it belongs. */
  #app .tab-pill{
    padding:10px 14px;
    font-size:15px;
    white-space:nowrap;
    flex:0 0 auto;
    min-height:44px;
  }
  #app .tab-pill + .tab-pill{ margin-left:2px; }

  /* Touch targets. 44px is the size a thumb actually hits. */
  #app button{ min-height:44px; padding-top:10px; padding-bottom:10px; }
  #app .icon-btn{ width:44px; height:44px; }
  #app input, #app select{ min-height:44px; }

  /* Roster rows wrapped raggedly, with no reliable place for the name. Stacked,
     the name is always first and always on its own line. */
  #app .member-row{
    flex-direction:column;
    align-items:flex-start !important;
    gap:6px;
    padding:12px 10px;
  }
  #app .member-row > *{ flex-basis:auto !important; }

  /* The header stack: title, subtitle and the edit toggle all competed for one
     line and the subtitle won by wrapping to three. */
  #app .rr-title{ font-size:20px; }
  #app .rr-header{ padding-bottom:0.8rem; margin-bottom:1rem; }

  /* Long text was reaching the screen edge with nothing between it and the
     bezel. */
  #app h2{ font-size:19px; }
  #app h3{ font-size:15px; }

  /* Anything that scrolls sideways gets momentum scrolling and a visible edge,
     so it is obvious there is more to the right rather than looking cut off. */
  #app [style*="overflow-x"], #app [style*="overflowX"]{
    -webkit-overflow-scrolling:touch;
  }

  /* The week grids set a 56px minimum on each column. A nine-digit AvA figure
     needs about 100px at the 16px font phones require, so every score was being
     clipped inside its own input — you could type a number and then not read it
     back. Widening the columns makes the grid wider, but it already scrolls
     sideways and the name column is sticky, so wider costs nothing that
     unreadable did not cost more.

     !important because the 56px is set inline on the header cells, and an
     inline style beats a stylesheet.

     NOTE: the same clipping happens on desktop — 79px is needed at 12px and the
     column is still 56px — but that is outside this release. */
  #app .week-grid th, #app .week-grid td{ min-width:104px !important; }
  #app .week-grid th:first-child, #app .week-grid td:first-child{ min-width:150px !important; }
}

/* The tab strip carries a class purely so this rule can reach it — the element
   itself is laid out with inline styles, and a stylesheet cannot override those.
   One class was a smaller and safer change than moving the whole layout out of
   the component. */
@media (max-width:640px){
  #app .tab-strip{
    flex-wrap:nowrap !important;
    width:auto !important;
    overflow-x:auto;
    scroll-snap-type:x proximity;
    -webkit-overflow-scrolling:touch;
    border-radius:14px;
    /* Room for the scroll shadow without the pills touching the edge. */
    padding:4px 6px;
    /* The strip scrolls; hide the bar itself, which on a phone is chrome
       nobody needs and which pushes the pills up by a few pixels. */
    scrollbar-width:none;
  }
  #app .tab-strip::-webkit-scrollbar{ display:none; }
  #app .tab-strip .tab-pill{ scroll-snap-align:start; }
}

/* ── v66: the group row stops scrolling ───────────────────────────────────────
   v52 made every pill row scroll sideways, which was right when there were
   sixteen flat pills and wrong once v56 grouped them. The group row is six
   items and it is the map of the whole dashboard — the one row where "there is
   more, off to the right" is a thing an officer should never have to discover.
   Scrolled, it also sliced pills mid-word at both edges ("t data", "Su"), which
   reads as a rendering fault rather than an invitation.

   Six icons at an equal share of the width fit a 390px screen with room over,
   so this row no longer scrolls at all. The labels are not thrown away: they
   stay in the DOM for screen readers, and the name of the group you are in is
   printed underneath the row, where it also serves as a heading for the tabs
   below it. That line is the reason this is safe on Home and Weekly update,
   which have no second row and would otherwise leave a lit icon as the only
   clue to where you are.

   The second row still scrolls — four tabs with words like "Needs attention"
   cannot be reduced to icons and cannot fit — so it keeps the scroll and gets
   the edge treatment it should have had in v52. */
@media (max-width:640px){
  /* overflow-x and width are both set by the rule above; this row opts out of
     the scrolling behaviour rather than inheriting it. */
  #app .tab-strip.tab-groups{
    overflow-x:visible;
    /* auto, not 100%: nothing in this stylesheet sets box-sizing, so widths are
       content-box and `width:100%` plus 8px of padding would put the row 8px
       wider than the page and give the whole dashboard a horizontal scrollbar.
       A block-level flex container at auto fills the space and subtracts its
       own padding, which is what was wanted in the first place. */
    width:auto !important;
    gap:0 !important;
    padding:4px;
  }
  /* flex:1 gives each of the six an equal share — about 57px on a 390px screen,
     comfortably over the 44px thumb target — so the row reads as a segmented
     control and pill widths do not shift when the label is hidden. */
  #app .tab-strip.tab-groups .tab-pill{
    flex:1 1 0;
    min-width:44px;
    padding:10px 0;
    gap:0;
    justify-content:center;
  }
  #app .tab-strip.tab-groups .tab-pill + .tab-pill{ margin-left:0; }
  #app .tab-strip.tab-groups .tab-pill i{ font-size:19px !important; }
  /* Visually hidden, not display:none — the button keeps an accessible name
     even if the aria-label on it is ever dropped. */
  #app .tab-strip.tab-groups .tab-label{
    position:absolute; width:1px; height:1px; margin:-1px;
    padding:0; overflow:hidden; clip-path:inset(50%); white-space:nowrap;
  }
  /* Inline, the dot made one pill wider than the other five. Cornered, every
     pill is the same width and the dot still says which group is shouting.
     The ring is the pill's own background, so the dot stays legible where it
     overlaps the icon. */
  #app .tab-strip.tab-groups .dot{
    position:absolute; top:7px; right:9px; margin-left:0 !important;
    box-shadow:0 0 0 2px var(--surface-1);
  }
  #app .tab-strip.tab-groups .tab-pill.active .dot{ box-shadow:0 0 0 2px var(--bg-accent); }

  #app .tab-group-name{ display:block; }

  /* The tab row: fade the ends instead of guillotining them, and keep
     scrollIntoView from parking the active pill flush against the bezel.
     The mask fades the track's own background at the ends too — surface-1 on
     surface-2 is a small enough step that this reads as a soft edge rather
     than a broken one, and the pills are what the eye is on. */
  #app .tab-strip:not(.tab-groups){
    scroll-padding-inline:14px;
    -webkit-mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
    mask-image:linear-gradient(90deg,transparent 0,#000 14px,#000 calc(100% - 14px),transparent 100%);
  }
}
#app input:focus, #app select:focus, #app textarea:focus{
  border-color:var(--border-accent); outline:none; box-shadow:0 0 0 2px var(--bg-accent);
}
#app button:hover{ background:var(--bg-accent); border-color:var(--border-accent); color:var(--text-accent); }
/* v45. Every affordance here was hover-only, so tabbing through the dashboard
   gave no indication of where you were. :focus-visible rather than :focus, so a
   mouse click doesn't leave a ring behind — the ring appears for keyboard use,
   which is who needs it. */
#app button:focus-visible,
#app .tab-pill:focus-visible,
#app .name-link:focus-visible,
#app .icon-btn:focus-visible,
#app [role="button"]:focus-visible,
#app a:focus-visible{
  outline:2px solid var(--text-accent); outline-offset:2px;
}
#app ::placeholder{ color:var(--text-muted); }
.rr-header{ border-bottom:1px solid var(--border-strong); padding-bottom:1.1rem; margin-bottom:1.25rem; }
.rr-divider{ height:2px; background:linear-gradient(90deg, transparent, var(--border-accent) 20%, var(--border-accent) 80%, transparent); border-radius:2px; margin-bottom:1.25rem; opacity:0.6; }
.rr-crest{ width:48px; height:48px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:20px; background:linear-gradient(160deg, rgba(212,175,55,0.28), rgba(212,175,55,0.08)); color:var(--text-accent); border:0.5px solid var(--border-accent); flex-shrink:0; }
.rr-title{ font-family:var(--font-display); margin:0; font-size:24px; letter-spacing:0.5px; color:var(--text-accent); font-weight:700; }
/* v45. Three blocks lived here: a light badge palette on :root, a
   [data-mode="dark"] override, and a prefers-color-scheme media query. All
   three were dead. Custom properties resolve from the nearest ancestor that
   declares them, and #app above declares every one of these, so #app always
   won for anything inside it — which is the entire dashboard.

   Deleted rather than repaired, deliberately. Making the cascade "work" would
   have handed a light badge palette to every officer whose phone is set to
   light mode, painted onto a surface that is dark either way: pale mint text on
   near-black. The dashboard is dark-only by design. This is now stated in one
   place instead of contradicted in four. */
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.badge-red{background:var(--badge-red-bg);color:var(--badge-red-fg)}
.badge-amber{background:var(--badge-amber-bg);color:var(--badge-amber-fg)}
.badge-coral{background:var(--badge-coral-bg);color:var(--badge-coral-fg)}
.badge-blue{background:var(--badge-blue-bg);color:var(--badge-blue-fg)}
.badge-green{background:var(--badge-green-bg);color:var(--badge-green-fg)}
.badge-gray{background:var(--surface-1);color:var(--text-secondary)}
.badge-tier-1{background:var(--tier-1-bg);color:var(--tier-1-fg)}
.badge-tier-2{background:var(--tier-2-bg);color:var(--tier-2-fg)}
.badge-tier-3{background:var(--tier-3-bg);color:var(--tier-3-fg)}
/* A square holding an icon at the head of a card. Never a status — it was
   badge-teal in five places purely because that class happened to produce a
   coloured square, which is how teal came to look like it meant something. */
.tile{background:var(--bg-accent);color:var(--text-accent)}
.av-1{background:rgba(143,180,217,0.20);color:var(--av-1)}
.av-2{background:rgba(195,168,221,0.20);color:var(--av-2)}
.av-3{background:rgba(219,163,184,0.20);color:var(--av-3)}
.av-4{background:rgba(143,201,180,0.20);color:var(--av-4)}
.av-5{background:rgba(214,185,138,0.20);color:var(--av-5)}
.av-6{background:rgba(169,196,140,0.20);color:var(--av-6)}
.av-7{background:rgba(201,168,154,0.20);color:var(--av-7)}
.av-8{background:rgba(159,176,201,0.20);color:var(--av-8)}
.member-row{transition:background-color .12s ease}
.member-row:hover{background:var(--surface-1)}
#app .tab-pill{border:none;border-radius:999px;background:transparent;padding:8px 14px;font-size:14px;color:var(--text-secondary);display:inline-flex;align-items:center;gap:6px;position:relative}
#app .tab-pill.active{background:var(--bg-accent);color:var(--text-accent);font-weight:500}
/* v66. Hidden on desktop, where the group pill carries its own label and this
   would only repeat it. Shown on phones, where the group row is icons. */
#app .tab-group-name{display:none;margin:9px 4px 0;font-size:13px;font-weight:500;letter-spacing:0.3px;color:var(--text-secondary)}
#app .icon-btn{width:32px;height:32px;padding:0;border-radius:var(--radius);border:0.5px solid var(--border-strong);background:var(--surface-1);display:inline-flex;align-items:center;justify-content:center}
.dot{width:7px;height:7px;border-radius:50%;background:var(--fill-danger);display:inline-block}
#app .name-link{background:none;border:none;padding:0;font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:6px}
#app .name-link:hover{background:transparent;color:var(--text-accent);text-decoration:underline}
.spark-dot{opacity:0;transition:opacity .1s ease}
.spark-cell:hover .spark-dot{opacity:1}
</style>
</head>
<body>
<div id="app"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script>
const { useState, useEffect, useMemo, useCallback, useRef } = React;

  const out = ["**Leadership cover**"];
  if (!wins.length) {
    out.push("No cover windows are set up.");
    return out.join("\n");
  }
  const anyLead = wins.some((w) => (s.standing[w.id] || {}).lead);
  if (!anyLead) {
    out.push("No standing rota has been set up yet, so nobody is recorded against any window. That is a gap in the dashboard \u2014 not a claim that these hours go uncovered.");
    return out.join("\n");
  }
  out.push("Standing rota, server time:");
  wins.forEach((w) => {
    const c = s.standing[w.id] || {};
    const bits = [];
    if (c.lead) bits.push("lead " + c.lead);
    if (c.backup) bits.push("backup " + c.backup);
    if ((c.r4s || []).length) bits.push("R4 " + c.r4s.join(", "));
    out.push("\u2022 " + w.label + " " + w.start + "\u2013" + w.end + " \u2014 " + (bits.length ? bits.join(", ") : "\u26A0\uFE0F nobody assigned"));
  });
  const changes = [];
  shiftWeekDates(weekKey).forEach((d) => {
    const day = (s.overrides || {})[d];
    if (!day) return;
    wins.forEach((w) => {
      const ov = day[w.id];
      if (!ov) return;
      const st = s.standing[w.id] || {};
      const same = (ov.lead || "") === (st.lead || "") && (ov.backup || "") === (st.backup || "") && (ov.r4s || []).join("\u0000") === (st.r4s || []).join("\u0000");
      if (same) return;
      const to = ov.lead ? ov.lead : "nobody";
      const instead = ov.lead && st.lead && ov.lead !== st.lead ? " instead of " + st.lead : "";
      const r4line = (ov.r4s || []).join("\u0000") !== (st.r4s || []).join("\u0000") ? ", R4 " + ((ov.r4s || []).length ? ov.r4s.join(", ") : "nobody") : "";
      changes.push("\u2022 " + shiftDayLabel(d) + " \u2014 " + w.label + ": " + to + instead + r4line + (ov.note ? " (" + ov.note + ")" : ""));
    });
  });
  if (changes.length) {
    out.push("");
    out.push("Changes this week:");
    changes.forEach((c) => out.push(c));
  }
  return out.join("\n");
}

/* ── v82: three new briefing sections ───────────────────────────────────────
   Growth (hero might and kills), KvK contribution, and the week's top
   performer. All three report the week that FINISHED, the same week as the AvA
   and donation recaps above them, and all three follow the rules the rest of
   the dashboard keeps:

     Same-player gains only. A player counts towards growth only if they were
     read at both ends of the week, so joiners, leavers and transfers between
     WPP and RISE never look like growth.

     Absence is not zero. A figure nobody read is left out and said to be
     missing. It is never printed as 0, and in the top-performer ranking a
     member without a figure is placed behind everyone who has one rather than
     being given a number they never scored.

     Deterministic. The App stores this text and the Reports tab rebuilds it
     before posting; briefingChanged compares the two. Nothing here reads the
     clock except to find the week, and nothing reads a store that is only
     loaded when somebody happens to open a tab (the Kingdom KvK records), so
     the same data always gives the same words. */
const BRIEF_RISERS = 5;
const BRIEF_KVK_TOP = 10;
const BRIEF_FIGHTERS = 5;
const BRIEF_RUNNERS_UP = 2;

function briefIds() {
  return [FEED_HOME_ID, FEED_SISTER_ID];
}
function briefLabels(feedObj) {
  const out = {};
  briefIds().forEach((id) => {
    const a = feedAlliance(feedObj, id);
    out[id] = (a && (a.tag || a.label)) || (id === FEED_HOME_ID ? "WPP" : "RISE");
  });
  return out;
}
function briefFeedReady(feedState) {
  return !!(feedState && feedState.status === "ready");
}
function briefSigned(v) {
  return (v < 0 ? "−" : "+") + fmtBig(Math.abs(v));
}

/* One week's hero might per player: the latest daily hero list read inside the
   week against the latest one read in the seven days before it. Same player at
   both ends, and only #75's top 100 are ever on the list. */
function briefHeroGains(might, week) {
  const H = heroStore(might);
  if (!H || !week) return null;
  const dates = heroDates(H);
  const last = feedAddDays(week, 6);
  let end = null, base = null;
  dates.forEach((d) => {
    if (d >= week && d <= last) end = d;
    if (d >= feedAddDays(week, -7) && d < week) base = d;
  });
  if (!end || !base) return { end, base, gains: {} };
  const cur = H.snaps[end], was = H.snaps[base];
  const gains = {};
  Object.keys(cur).forEach((pid) => {
    const a = heroVal(cur, pid, 0), b = heroVal(was, pid, 0);
    if (a !== null && b !== null) gains[pid] = a - b;
  });
  return { end, base, gains };
}

/* One week's kills per player: the collector keeps each player's latest kill
   total per week, so the week's kills are this week's latest total less last
   week's. A total that went down is a misread, not negative kills, and is
   left out. */
function briefKillGains(might, week) {
  if (!might || !feedIsObj(might.kills) || !week) return {};
  const prev = feedAddDays(week, -7);
  const out = {};
  Object.keys(might.kills).forEach((pid) => {
    const k = might.kills[pid];
    if (!feedIsObj(k)) return;
    const a = Number(k[week]), b = Number(k[prev]);
    if (typeof k[week] !== "number" || typeof k[prev] !== "number" || !Number.isFinite(a) || !Number.isFinite(b) || a < b) return;
    out[pid] = a - b;
  });
  return out;
}

/* Everything the Growth section and the top performer need from the feed,
   worked out once. Player ids are matched to roster members the way the
   lastasylum.gg tab matches them: a link, or an exact, alias or folded name,
   and never a guess. */
function briefFeedWeek(feedState, week, members) {
  if (!briefFeedReady(feedState)) return { ready: false };
  const ids = briefIds();
  const labels = briefLabels(feedState.feed);
  const might = feedState.might;
  const today = feedLocalDay(Date.now()).date;
  const bucketFor = (g) => (g.buckets || []).find((b) => b.key === week) || null;
  const killBucket = might ? bucketFor(growthBuckets(might, ids, "week", today)) : null;
  const heroBucket = might ? bucketFor(growthBuckets(heroGrowthDays(might), ids, "week", today)) : null;

  const roster = heroRoster(feedState.feed, ids);
  const aidOf = {};
  roster.forEach((r) => { aidOf[r.pid] = r.aid; });
  const names = might && feedIsObj(might.names) ? might.names : {};
  const nameOf = (pid) => (names[pid] && names[pid].name) || (roster.find((r) => r.pid === pid) || {}).name || pid;

  const hero = might ? briefHeroGains(might, week) : null;
  const heroRows = hero ? Object.keys(hero.gains).filter((pid) => ids.indexOf(aidOf[pid]) !== -1)
    .map((pid) => ({ pid, aid: aidOf[pid], gain: hero.gains[pid] })) : [];
  const killGains = might ? briefKillGains(might, week) : {};
  const killRows = Object.keys(killGains).filter((pid) => {
    const aid = aidOf[pid] || (names[pid] && names[pid].aid);
    return ids.indexOf(aid) !== -1;
  }).map((pid) => ({ pid, aid: aidOf[pid] || names[pid].aid, gain: killGains[pid] }));

  const entries = [];
  const seen = {};
  heroRows.concat(killRows).forEach((r) => {
    if (seen[r.pid]) return;
    seen[r.pid] = true;
    entries.push({ pid: r.pid, name: nameOf(r.pid) });
  });
  const res = feedResolve(entries, members || [], feedState.links || {});
  const memberOf = (pid) => { const x = res.get(pid); return x && x.member ? x.member : null; };
  const label = (r) => { const m = memberOf(r.pid); return m ? m.name : nameOf(r.pid); };
  heroRows.forEach((r) => { r.name = label(r); r.member = memberOf(r.pid); });
  killRows.forEach((r) => { r.name = label(r); r.member = memberOf(r.pid); });
  const order = (a, b) => b.gain - a.gain || String(a.name).localeCompare(String(b.name));
  heroRows.sort(order);
  killRows.sort(order);

  const heroByMember = new Map(), killByMember = new Map();
  heroRows.forEach((r) => { if (r.member && !heroByMember.has(r.member.id)) heroByMember.set(r.member.id, r.gain); });
  killRows.forEach((r) => { if (r.member && !killByMember.has(r.member.id)) killByMember.set(r.member.id, r.gain); });

  return {
    ready: true, ids, labels, heroBucket, killBucket, hero, heroRows, killRows,
    heroByMember, killByMember
  };
}

function briefBucketLine(bucket, ids, labels, metric) {
  if (!bucket) return null;
  const parts = [];
  let days = 0;
  bucket.values.forEach((v, i) => {
    const val = v ? (metric === "kills" ? v.kills : v.power) : null;
    if (v) days = Math.max(days, metric === "kills" ? v.killDays : v.days);
    parts.push(labels[ids[i]] + " " + (val === null || val === void 0 ? "not read" : metric === "kills" ? fmtBig(val) : briefSigned(val)));
  });
  if (!days) return null;
  return parts.join("  ·  ") + "  (" + days + " of " + bucket.length + " days read)";
}

function reportBriefGrowth(fw, week) {
  const head = "**Hero might & kills — week of " + fmtWeekRange(week) + "**";
  if (!fw || !fw.ready) {
    return head + "\nThe lastasylum.gg readings could not be read when this was put together, so there is nothing to report here. That says nothing about anybody's growth.";
  }
  const lines = [head];
  const heroLine = briefBucketLine(fw.heroBucket, fw.ids, fw.labels, "power");
  const killLine = briefBucketLine(fw.killBucket, fw.ids, fw.labels, "kills");
  lines.push("Hero might: " + (heroLine || "no readings for this week"));
  lines.push("Kills: " + (killLine || "no readings for this week"));
  const tag = (r) => fw.labels[r.aid] ? " (" + fw.labels[r.aid] + ")" : "";
  const risers = fw.heroRows.filter((r) => r.gain > 0).slice(0, BRIEF_RISERS);
  lines.push("");
  if (risers.length) {
    lines.push("Biggest hero might gains:");
    risers.forEach((r, i) => lines.push(medal(i) + " " + r.name + tag(r) + " — " + briefSigned(r.gain)));
  } else {
    lines.push(fw.hero && fw.hero.end && fw.hero.base
      ? "Nobody in WPP or RISE gained hero might between the two readings."
      : "Hero might: no list read both inside the week and in the week before, so no individual gains.");
  }
  const fighters = fw.killRows.filter((r) => r.gain > 0).slice(0, BRIEF_RISERS);
  lines.push("");
  if (fighters.length) {
    lines.push("Most kills:");
    fighters.forEach((r, i) => lines.push(medal(i) + " " + r.name + tag(r) + " — " + fmtBig(r.gain)));
  } else {
    lines.push(fw.killRows.length ? "No kills made between the two weekly readings." : "Kills: no player was read both this week and last, so no individual figures.");
  }
  lines.push("");
  lines.push("_Same-player gains only, so joiners, leavers and moves between alliances never show up as growth. Hero might covers #75's top 100 only. Kills from Saturday's KvK land in next week's figure; this week's KvK is in the KvK section._");
  return lines.join("\n");
}

/* KvK points for the week from the AvA / KvK grid (what an import of the
   alliance's KvK screen fills), and who fought from the collector's readings
   before and after the war. */
function reportBriefKvk(ctx, week, warLog, feedState) {
  const sat = feedAddDays(week, 6);
  const war = ((warLog || {}).kvk || {})[week] || {};
  const match = briefFeedReady(feedState) && feedState.kvk && feedIsObj(feedState.kvk.matches) ? feedState.kvk.matches[sat] : null;
  const opp = war.opponent || (match ? (feedOppServer(match.opponent) ? "#" + feedOppServer(match.opponent) : "") : "");
  const lines = ["**KvK contribution — Saturday " + fmtWeek(sat) + (opp ? " vs " + opp : "") + "**"];

  const ranked = rankWeekL(ctx.kvk, ctx.members, week);
  const total = sumWeekL(ctx.kvk, ctx.members, week);
  const theirs = Number(war.theirTotal) || 0;
  if (theirs > 0) {
    const ours = war.ourTotal !== void 0 && war.ourTotal !== "" ? Number(war.ourTotal) || 0 : total;
    lines.push((ours >= theirs ? "✅ Won" : "❌ Lost") + " — " + fmtBig(ours) + " vs " + fmtBig(theirs));
  }
  if (ranked.length) {
    lines.push("KvK points: **" + total.toLocaleString() + "**  ·  " + ranked.length + " of " + ctx.members.length + " scored");
    lines.push("");
    lines.push("Top " + Math.min(BRIEF_KVK_TOP, ranked.length) + " by points:");
    ranked.slice(0, BRIEF_KVK_TOP).forEach((r, i) => lines.push(medal(i) + " " + r.name + " — " + r.value.toLocaleString()));
  } else {
    lines.push("KvK points: not imported for this week.");
  }

  lines.push("");
  if (!briefFeedReady(feedState)) {
    lines.push("Who fought: the lastasylum.gg readings could not be read when this was put together.");
  } else if (!match) {
    lines.push("Who fought: no before/after reading for that Saturday.");
  } else {
    const ids = briefIds();
    const labels = briefLabels(feedState.feed);
    const pids = new Set();
    ["pre", "post"].forEach((s) => { if (feedIsObj(match[s]) && feedIsObj(match[s].names)) Object.keys(match[s].names).forEach((p) => pids.add(p)); });
    const entries = [...pids].map((pid) => ({ pid, name: (match.post && match.post.names && match.post.names[pid]) || (match.pre && match.pre.names && match.pre.names[pid]) || pid }));
    const resolved = feedResolve(entries, ctx.members, feedState.links || {});
    const eff = feedKvkEffort(Object.assign({ saturday: sat }, match), resolved, null, labels);
    if (!eff || !eff.killsRecorded || !eff.killsKnown) {
      lines.push("Who fought: kills were not readable both before and after this KvK.");
    } else {
      lines.push("Turnout: **" + eff.fought + " of " + eff.killsKnown + "** made kills  ·  " + fmtBig(eff.killsTotal) + " kills in all");
      const top = eff.rows.filter((r) => r.kills !== null && r.kills > 0).slice(0, BRIEF_FIGHTERS);
      if (top.length) {
        lines.push("Top fighters:");
        top.forEach((r, i) => lines.push(medal(i) + " " + (r.member ? r.member.name : r.name) + (r.alliance ? " (" + r.alliance + ")" : "") + " — " + fmtBig(r.kills)));
      }
      lines.push("_Counts WPP and RISE players read both before and after. Anyone read only once is not known, not idle._");
    }
  }
  return lines.join("\n");
}

/* Top performer. Every active member is ranked in each category that has data
   for the week; ties share a place, and anyone without a figure is placed
   after everyone with one. The places are added up and the lowest total wins.
   A tie for the lowest total is reported as a tie, never broken by something
   arbitrary like the alphabet. */
function briefOrdinal(n) {
  const v = n % 100;
  if (v >= 11 && v <= 13) return n + "th";
  return n + (["th", "st", "nd", "rd"][n % 10] || "th");
}
function briefTopPerformer(ctx, week, fw) {
  const members = ctx.members || [];
  const grid = (look) => (m) => { const v = Number(look(m.name)[week]) || 0; return v > 0 ? v : null; };
  const cats = [
    { key: "ava", label: "AvA", value: grid(ctx.ava) },
    { key: "kvk", label: "KvK", value: grid(ctx.kvk) },
    { key: "don", label: "donations", value: grid(ctx.don) }
  ];
  if (fw && fw.ready) {
    cats.push({ key: "hero", label: "hero might", value: (m) => (fw.heroByMember.has(m.id) ? fw.heroByMember.get(m.id) : null) });
    cats.push({ key: "kills", label: "kills", value: (m) => (fw.killByMember.has(m.id) ? fw.killByMember.get(m.id) : null) });
  }
  const used = [], skipped = [];
  const place = {};
  members.forEach((m) => { place[m.id] = { member: m, total: 0, places: {} }; });
  cats.forEach((c) => {
    const vals = members.map((m) => ({ m, v: c.value(m) }));
    const valued = vals.filter((x) => x.v !== null && x.v !== void 0);
    if (!valued.length) { skipped.push(c.label); return; }
    used.push(c);
    vals.forEach((x) => {
      const p = x.v === null || x.v === void 0 ? valued.length + 1 : 1 + valued.filter((y) => y.v > x.v).length;
      const tied = x.v === null || x.v === void 0 ? false : valued.filter((y) => y.v === x.v).length > 1;
      place[x.m.id].places[c.key] = { place: p, tied, has: !(x.v === null || x.v === void 0) };
      place[x.m.id].total += p;
    });
  });
  const rows = Object.keys(place).map((k) => place[k]).sort((a, b) => a.total - b.total || a.member.name.localeCompare(b.member.name));
  return { used, skipped, rows };
}
function reportBriefTopPerformer(ctx, week, fw) {
  const head = "**Top performer — week of " + fmtWeekRange(week) + "**";
  const t = briefTopPerformer(ctx, week, fw);
  if (!t.used.length || !t.rows.length) {
    return head + "\nNothing has been imported or read for this week yet, so there is nobody to name.";
  }
  const describe = (r) => t.used.map((c) => {
    const p = r.places[c.key];
    return p.has ? (p.tied ? "=" : "") + briefOrdinal(p.place) + " " + c.label : "no " + c.label + " figure";
  }).join(" · ");
  const best = t.rows[0].total;
  const winners = t.rows.filter((r) => r.total === best);
  const lines = [head];
  if (winners.length === 1) {
    lines.push("\u{1F3C6} **" + winners[0].member.name + "**");
    lines.push(describe(winners[0]));
  } else {
    lines.push("\u{1F3C6} Joint top performers: **" + winners.slice(0, 3).map((r) => r.member.name).join("**, **") + "**" + (winners.length > 3 ? " and " + (winners.length - 3) + " more" : ""));
    winners.slice(0, 3).forEach((r) => lines.push("• " + r.member.name + " — " + describe(r)));
  }
  const rest = t.rows.filter((r) => r.total > best).slice(0, BRIEF_RUNNERS_UP);
  if (rest.length && winners.length === 1) {
    lines.push("");
    lines.push("Runners-up:");
    rest.forEach((r) => lines.push("• " + r.member.name + " — " + describe(r)));
  }
  lines.push("");
  lines.push("_Ranked on " + t.used.map((c) => c.label).join(", ") + (t.skipped.length ? " (no data this week: " + t.skipped.join(", ") + ")" : "") +
    ". Each member's places are added up and the lowest total wins. Anyone without a figure in a category is placed after everyone with one._");
  return lines.join("\n");
}

/* ── Monday officer briefing ────────────────────────────────────────────────
   The dashboard answers questions when asked. This is the one thing that speaks
   first — a short list of what needs a person's attention this week, ready to
   post in the officer channel.

   Composed from computed facts, NOT written by a model. Every sentence traces
   to a number the risk engine produced. A model writing prose about who is
   slacking is exactly where a confident false statement about a named person
   would creep in, and this is the officer channel — what it says about someone
   is what officers act on.

   It opens with what the data does NOT cover. A briefing built on two imported
   weeks that reads as though it covers four is worse than no briefing, because
   it looks authoritative. */
function briefFreshness(ctx) {
  const missing = [];
  const cur = currentWeekKey();
  const idx = WEEK_KEYS.indexOf(cur);
  const recent = WEEK_KEYS.slice(Math.max(0, (idx >= 0 ? idx + 1 : WEEK_KEYS.length) - 4), idx >= 0 ? idx + 1 : WEEK_KEYS.length);
  const avaHave = recent.filter((w) => ctx.avaWeeks.indexOf(w) !== -1).length;
  const donHave = recent.filter((w) => ctx.donWeeks.indexOf(w) !== -1).length;
  if (avaHave < recent.length) missing.push("AvA " + avaHave + " of " + recent.length + " weeks");
  if (donHave < recent.length) missing.push("donations " + donHave + " of " + recent.length + " weeks");
  return { avaHave, donHave, weeks: recent.length, missing };
}

/* The week a Monday briefing is about is the one that just FINISHED, not the
   one starting today. currentWeekKey() on a Monday returns the Sunday just
   gone, so the recaps step back one. */
function previousWeekKey(from) {
  const i = WEEK_KEYS.indexOf(from || currentWeekKey());
  return i > 0 ? WEEK_KEYS[i - 1] : null;
}

function buildBriefing(opts) {
  const ctx = opts.riskCtx;
  const ranked = opts.ranked || [];
  const warLog = opts.warLog;
  const week = opts.week || previousWeekKey();
  const fresh = briefFreshness(ctx);
  const sections = [];

  /* Section one, always: what this is based on. A briefing built on one
     imported week that reads as though it covers four is worse than none,
     because it looks authoritative. Everything below inherits this line. */
  const head = ["**Officer briefing — week of " + (week ? fmtWeekRange(week) : "—") + "**"];
  if (fresh.missing.length) {
    head.push("\u26A0\uFE0F Based on partial data: " + fresh.missing.join(", ") +
      " imported over the last " + fresh.weeks + " weeks. Anyone missing from those weeks is unknown, not idle \u2014 not someone who scored nothing.");
  } else {
    head.push("Based on " + fresh.weeks + " complete weeks of data.");
  }
  sections.push({ key: "head", label: "Data note", text: head.join("\n") });

  const hasAva = week && ctx.avaWeeks.indexOf(week) !== -1;
  const hasDon = week && ctx.donWeeks.indexOf(week) !== -1;

  sections.push({
    key: "ava", label: "AvA recap",
    text: hasAva
      ? reportAvaRecap(ctx, week, warLog, true)
      : "**AvA — week of " + (week ? fmtWeekRange(week) : "—") +
        "**\nNot imported yet, so there is nothing to report for this week. No conclusions should be drawn from that."
  });

  sections.push({
    key: "don", label: "Donation recap",
    text: hasDon
      ? reportDonationRecap(ctx, week, true)
      : "**Donations — week of " + (week ? fmtWeekRange(week) : "—") +
        "**\nNot imported yet, so there is nothing to report for this week. No conclusions should be drawn from that."
  });

  /* v82. KvK contribution, hero might and kills, and the week's top
     performer, between the recaps and the check-in list: the first three
     sections after the data note are about the week, the last is about people
     who need a word. opts.feed is the App's lastasylum.gg state; without it
     the feed-based parts say they could not be read rather than vanishing. */
  if (week) {
    const fw = briefFeedWeek(opts.feed, week, ctx.members);
    sections.push({ key: "kvk", label: "KvK contribution", text: reportBriefKvk(ctx, week, warLog, opts.feed) });
    sections.push({ key: "growth", label: "Hero might & kills", text: reportBriefGrowth(fw, week) });
    sections.push({ key: "top", label: "Top performer", text: reportBriefTopPerformer(ctx, week, fw) });
  }

  /* The check-in list rests entirely on imported weeks. With none, the risk
     engine still produces scores — and publishing them would name people on no
     evidence, in the channel where officers act on what they read. */
  const haveData = ctx.avaWeeks.length > 0 || ctx.donWeeks.length > 0;
  sections.push({
    key: "attention", label: "Officer check-in list",
    text: haveData
      ? reportAttention(ranked, opts.contactIndex)
      : "**Officer check-in list**\nNo AvA or donation weeks have been imported, so there is nothing to judge anyone on yet. Nobody is listed."
  });

  /* v82: the Leadership cover / R4 rotation section is no longer part of the
     briefing. Both still exist as reports of their own on the Reports tab. */

  return {
    sections,
    body: sections.map((x) => x.text).join("\n\n\u2014\u2014\u2014\n\n"),
    week,
    partial: fresh.missing.length > 0,
    hasAva, hasDon
  };
}

/* ── Leaving the briefing ready for the scheduler ───────────────────────────
   The scoring rules live in this file and nowhere else. An Apps Script trigger
   cannot run them, so the honest way to send a briefing unattended is NOT to

        ml.push([row.name, rosterOf(row.pid), labels[aid]].concat(weeks.map((w) => askFeedN(h[w]))).join(" | "));
      });
      block("LASTASYLUM.GG MIGHT BY WEEK — in-game name | roster | alliance | " + weeks.join(" | "), ml, 3);

      const gains = weeks.map((w) => briefKillGains(might, w));
      const kl = ["Kills made in each week: that week's latest kill total minus the week before's, same player. \"-\" = not read in both weeks, or the total went down (a misread). Remember Saturday's KvK kills land in the next week."];
      pageRows.forEach(({ aid, row }) => {
        kl.push([row.name, rosterOf(row.pid), labels[aid]].concat(gains.map((g) => askFeedN(g[row.pid]))).join(" | "));
      });
      block("LASTASYLUM.GG KILLS MADE BY WEEK — in-game name | roster | alliance | " + weeks.join(" | "), kl, 2);
    }

    /* Alliance totals by week, from the same daily same-player gains as
       Home's Growth card and the briefing. */
    const today = feedLocalDay(nowMs).date;
    const g = growthBuckets(might, ids, "week", today).buckets.slice(-ASK_FEED_WEEKS - 2);
    const hg = growthBuckets(heroGrowthDays(might), ids, "week", today).buckets.slice(-ASK_FEED_WEEKS - 2);
    if (g.length || hg.length) {
      const keys = [...new Set(g.map((b) => b.key).concat(hg.map((b) => b.key)))].sort();
      const gl = ["Same-player gains added up per alliance. \"days\" = how many of the week's days were read; a week with few days read is short, not quiet. A week still running is marked (so far)."];
      keys.forEach((k) => {
        const b = g.find((x) => x.key === k), hb = hg.find((x) => x.key === k);
        const cells = [k + ((b && b.open) || (hb && hb.open) ? " (so far)" : "")];
        ids.forEach((id, i) => {
          const v = b && b.values[i], hv = hb && hb.values[i];
          cells.push(v ? askFeedS(v.power) : "-", v && v.kills !== null ? askFeedN(v.kills) : "-", v ? String(v.days) : "0", hv ? askFeedS(hv.power) : "-");
        });
        gl.push(cells.join(" | "));
      });
      block("LASTASYLUM.GG ALLIANCE GROWTH BY WEEK — week | " + ids.map((id) => labels[id] + " might gain | " + labels[id] + " kills | " + labels[id] + " days read | " + labels[id] + " hero might gain").join(" | "), gl, 1);
    }
  }

  /* 3. #75's hero might top 100. */
  if (home) {
    const dates = heroDates(H);
    const baseDay = heroBase(dates, home.day, "week");
    const was = baseDay ? H.snaps[baseDay] : null;
    const cur = H.snaps[home.day];
    const hl = ["Read on " + home.day + (baseDay ? "; change is against the list read on " + baseDay + " (same player on both lists; \"-\" = not on that list)." : "; no list from about a week earlier to compare with, so no change column figures.")];
    home.rows.forEach((r) => {
      const best = heroVal(cur, r.pid, 1);
      const before = was ? heroVal(was, r.pid, 0) : null;
      hl.push([r.rank, r.name, r.tag || "-", askFeedN(r.value), before !== null ? askFeedS(r.value - before) : "-", (heroInfo[r.pid] && heroInfo[r.pid].h) || "-", askFeedN(best), rosterOf(r.pid)].join(" | "));
    });
    block("LASTASYLUM.GG #" + FEED_SERVER + " HERO MIGHT TOP 100 — rank | name | tag | total hero might | change | strongest hero | its might | roster", hl, 2);
  }

  /* 4. KvK: the matches the collector read before and after. */
  if (matches.length) {
    const sl = ["Before/after readings of our two alliances around each Saturday KvK. result: from the site's capture list (it only lists captures, so \"not known\" is not a hold). power is the server's top-100 might before the war. Officers' own KvK results and points are in the WAR LOG and KVK SCORES sections above, which take precedence."];
    matches.slice(0, ASK_FEED_MATCHES).forEach((m) => {
      const e = feedKvkEffort(m, null, null, labels);
      const side = (k) => (m.preServers && m.preServers[k]) || (m.postServers && m.postServers[k]) || null;
      const us = side("us"), them = side("them");
      const res = warResult(kvk, null, m);
      sl.push([m.saturday, feedOppServer(m.opponent) ? "#" + feedOppServer(m.opponent) : "not set", res.result || "not known",
        us ? askFeedN(us.top100) : "-", them ? askFeedN(them.top100) : "-",
        e && e.killsRecorded ? e.fought + " of " + e.killsKnown : "not recorded", e && e.killsRecorded ? askFeedN(e.killsTotal) : "-"].join(" | "));
    });
    block("LASTASYLUM.GG KVK MATCHES — saturday | opponent | result | our top-100 power | their top-100 power | made kills (of those read twice) | total kills", sl, 1);

    if (fought) {
      const e = feedKvkEffort(fought, null, null, labels);
      const fl = ["Saturday " + fought.saturday + (feedOppServer(fought.opponent) ? " vs #" + feedOppServer(fought.opponent) : "") + ". kills = kills between the reading before and the one after. \"-\" = not read both times: NOT KNOWN, not idle. 0 = read both times and made no kills."];
      e.rows.forEach((r) => fl.push([r.name, rosterOf(r.pid), r.alliance || "-", askFeedN(r.kills), askFeedN(r.pre), askFeedN(r.post), askFeedS(r.change)].join(" | ")));
      block("LASTASYLUM.GG WHO FOUGHT, LATEST KVK — in-game name | roster | alliance | kills | might before | might after | might change", fl, 2);
    }
  }

  /* 5. Opponents set on the dashboard, and their hero lists. */
  const ol = [];
  const ks = targetsSide("kvk", feedState, might, nowMs);
  const as = targetsSide("ava", feedState, might, nowMs);
  if (ks.state === "unset") ol.push("KvK opponent: none set for the coming or current Saturday.");
  else {
    ol.push("KvK opponent: #" + ks.server + " for Saturday " + ks.forSaturday + "." +
      (ks.state === "waiting" ? " Their hero list has not been read yet." : " Their hero list (top 100) was read " + askFeedAt(ks.fetchedAt) + (ks.stale ? ", which is older than it should be" : "") + "."));
  }
  if (as.state === "unset" || as.state === "expired") ol.push("AvA opponent: " + (as.state === "expired" ? "the last one set is more than " + FEED_AVA_DAYS + " days old, so none is current." : "none set."));
  else {
    ol.push("AvA opponent: " + (as.tag ? "[" + as.tag + "] " : "") + "on #" + as.server + ", set " + askFeedAt(as.setAt) + "." +
      (as.state === "waiting" ? " Their server's hero list has not been read yet." :
        as.state === "empty" ? " No player with that tag is on their server's top-100 hero list." :
        as.state === "pick" ? " No alliance tag was picked, so their players cannot be told apart." : ""));
  }
  if (ol.length) block("LASTASYLUM.GG OPPONENTS", ol, 1);
  if (ks.state === "ready" && ks.rows.length) {
    block("LASTASYLUM.GG KVK OPPONENT #" + ks.server + " HERO MIGHT TOP 100 — rank | name | tag | total hero might",
      ["Their top 100 only; players below that are not listed, not weak."].concat(ks.rows.map((r) => [r.rank || "-", r.name, r.tag || "-", askFeedN(r.value)].join(" | "))), 4);
  }
  if (as.state === "ready" && as.rows.length) {
    block("LASTASYLUM.GG AVA OPPONENT " + (as.matchedTag || as.tag) + " ON #" + as.server + " — rank on their server's hero list | name | total hero might",
      ["Only their players in their server's top 100 by hero might are known."].concat(as.rows.map((r) => [r.rank || "-", r.name, askFeedN(r.value)].join(" | "))), 2);
  }

  /* v84. Opponents day by day, from collector c9: each server's power,
     kills and hero lists read with every opponent read, one reading kept per
     day. This is the only place "yesterday" exists for another server: the
     site itself shows current totals only. Gains are worked out here, same
     player on both days, so the model never has to subtract. */
  const opp = might && feedIsObj(might.opp) ? might.opp : {};
  Object.keys(opp).filter((n) => /^\d+$/.test(n) && Number(n) !== FEED_SERVER).sort((a, b) => Number(a) - Number(b)).forEach((n) => {
    const S = opp[n];
    if (!feedIsObj(S) || !feedIsObj(S.days)) return;
    const days = Object.keys(S.days).filter((d) => /^\d{4}-\d{2}-\d{2}$/.test(d) && feedIsObj(S.days[d]) && feedIsObj(S.days[d].p)).sort().slice(-ASK_OPP_DAYS);
    if (!days.length) return;
    const info = feedIsObj(S.info) ? S.info : {};
    const val = (d, pid, i) => {
      const x = S.days[d].p[pid];
      const v = Array.isArray(x) ? x[i] : null;
      return v !== null && v !== void 0 && Number.isFinite(Number(v)) && Number(v) >= 0 ? Number(v) : null;
    };
    const gain = (a, b, pid, i) => { const x = val(a, pid, i), y = val(b, pid, i); return x !== null && y !== null ? y - x : null; };
    const L = days[days.length - 1];
    const pairs = [];
    for (let i = days.length - 1; i > 0; i--) pairs.push([days[i - 1], days[i]]);
    const pids = Object.keys(S.days[L].p);
    pids.sort((a, b) => (val(L, b, 1) || -1) - (val(L, a, 1) || -1) || (val(L, b, 0) || -1) - (val(L, a, 0) || -1) || String(a).localeCompare(String(b)));
    const head = ["name", "tag", "kills " + L].concat(pairs.map((p) => "kills gain " + p[0] + "\u2192" + p[1]),
      ["might " + L], pairs.length ? ["might change " + pairs[0][0] + "\u2192" + pairs[0][1]] : [], ["hero might " + L]);
    const lines = [
      "Readings kept by the collector, one per day (the last read that day, Berlin date): " + days.map((d) => d + " (read " + askFeedAt(S.days[d].at) + ")").join(", ") + ".",
      "Each list is that server's top 100 for kills, might or hero might, so a player can be on one list and not another; \"-\" = not on that list that day, NOT zero. A gain is the same player's total on the later day minus the earlier day; \"-\" if either is missing. Days are not always exactly 24 hours apart \u2014 the read times are above.",
      "When the officer says \"yesterday\", use the gain column ending on the latest day if that day is today, and say which two readings it compares."
    ];
    pids.forEach((pid) => {
      const i0 = info[pid] || {};
      lines.push([i0.n || pid, i0.t || "-", askFeedN(val(L, pid, 1))]
        .concat(pairs.map((p) => askFeedS(gain(p[0], p[1], pid, 1))), [askFeedN(val(L, pid, 0))],
          pairs.length ? [askFeedS(gain(pairs[0][0], pairs[0][1], pid, 0))] : [], [askFeedN(val(L, pid, 2))]).join(" | "));
    });
    if (days.length < 2) lines.push("Only one day has been read so far, so there are no gains yet. The next reading is due within about 12 hours of the last.");
    /* Never left out for size: this is the one thing a live lookup cannot
       replace, because the site has no history. */
    block("LASTASYLUM.GG OPPONENT #" + n + " BY DAY \u2014 " + head.join(" | "), lines, 1);
  });

  /* 6. Kings of #75. */
  const kings = feedKings(kvk);
  if (kings && kings.rows.length) {
    block("LASTASYLUM.GG KINGS OF #" + FEED_SERVER + ", most recent " + Math.min(ASK_FEED_KINGS, kings.rows.length) + " — inauguration | king | alliance | alliance's server",
      kings.rows.slice(0, ASK_FEED_KINGS).map((k) => [k.date, k.king || "-", (k.tag ? "[" + k.tag + "] " : "") + (k.alliance || ""), "#" + k.server].join(" | ")), 3);
  }
  return blocks;
}

/* Joins the blocks, leaving out whole tables (highest prio number first,
   later tables before earlier ones) until the snapshot fits, and says which. */
function askFeedFit(blocks, used) {
  const keep = blocks.map(() => true);
  const size = () => blocks.reduce((n, b, i) => n + (keep[i] ? b.text.length : 0), 0);
  const order = blocks.map((b, i) => i).filter((i) => blocks[i].prio > 1)
    .sort((a, b) => blocks[b].prio - blocks[a].prio || b - a);
  const dropped = [];
  for (const i of order) {
    if (used + size() + 400 <= ASK_CONTEXT_BUDGET) break;
    keep[i] = false;
    dropped.push(blocks[i].title.split(" — ")[0]);
  }
  let text = blocks.filter((b, i) => keep[i]).map((b) => b.text).join("");
  if (dropped.length) {
    text += "\n\n## LASTASYLUM.GG — LEFT OUT FOR SIZE\nThese tables were not sent with this question because the snapshot would have been too large: " + dropped.join("; ") +
      ". They are NOT EMPTY. If the question needs them, say they were left out and point the officer to the lastasylum.gg tab or Home.";
  }
  return text;
}

/* Rendering. A deliberately small subset: paragraphs, bullets, bold, code.
   The system prompt asks for exactly that and forbids tables. */
function askInline(s, keyBase) {
  return String(s).split(/(\*\*[^*]+\*\*|`[^`]+`)/g).filter(Boolean).map((p, i) => {
    if (/^\*\*[^*]+\*\*$/.test(p)) return el("strong", { key: keyBase + "b" + i, style: { color: "var(--text-primary)" } }, p.slice(2, -2));
    if (/^`[^`]+`$/.test(p)) return el("code", { key: keyBase + "c" + i, style: { fontSize: "12px", background: "var(--surface-1)", padding: "1px 5px", borderRadius: "5px" } }, p.slice(1, -1));
    return p;
  });
}
function askRender(text) {
  const lines = String(text || "").split(/\n/);
  const nodes = [];
  let bullets = null;
  const flush = () => {
    if (bullets && bullets.length) nodes.push(el("ul", { key: "u" + nodes.length, style: { margin: "4px 0 10px", paddingLeft: "20px" } }, bullets));
    bullets = null;
  };
  lines.forEach((raw, i) => {
    const line = raw.replace(/\s+$/, "");
    const b = line.match(/^\s*(?:[-*\u2022]|\d+[.)])\s+(.*)$/);
    if (b) {
      if (!bullets) bullets = [];
      bullets.push(el("li", { key: i, style: { margin: "3px 0", lineHeight: 1.5 } }, askInline(b[1], i + "-")));
      return;
    }
    flush();
    if (!line.trim()) return;
    const h = line.match(/^#{1,4}\s+(.*)$/);
    if (h) {
      nodes.push(el("div", { key: i, style: { fontWeight: 600, color: "var(--text-accent)", margin: "12px 0 4px", fontSize: "14px" } }, askInline(h[1], i + "-")));
      return;
    }
    nodes.push(el("p", { key: i, style: { margin: "0 0 9px", lineHeight: 1.6 } }, askInline(line, i + "-")));
  });
  flush();
  return nodes;
}

/* ── Proposed changes ───────────────────────────────────────────────────────
   Ask reads and never writes, which is right. This is the middle position: the
   officer describes an intent, the model returns a proposal, and the officer
   approves it line by line.

   The safety property is the same one screenshot import uses. There, the model
   transcribes rows and this code builds the shapes and runs the checks. Here,
   the model proposes and this code resolves the names, fills in the current
   values from live state, discards anything it cannot verify, and applies
   through the same snapshot-then-save path an import uses. The model never
   constructs what gets written. */
const PROPOSE_FIELD_LABEL = { status: "Status", rank: "Rank", mentor: "Mentor" };

/* Turn the model's proposal into edits this dashboard can vouch for.
